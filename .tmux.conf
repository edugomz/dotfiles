set -as terminal-overrides ",tmux-256color:RGB"
set -g allow-passthrough on

set -g mouse on

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Pick a file path from pane scrollback and open it in $EDITOR (fpp)
bind o split-window -c "#{pane_current_path}" "tmux capture-pane -pS -3000 -t '#{pane_id}' | fpp"

# Project workflow (see bin/tp): one session per project dir
# prefix+a: another claude window in the current dir (window stays a shell after claude exits)
bind a new-window -c "#{pane_current_path}" -n claude \; send-keys claude Enter
# prefix+f: fuzzy-pick a project session (replaces default find-window)
bind f display-popup -E -w 40% -h 40% \
  "tmux ls -F '#S' | fzf --reverse | xargs -r tmux switch-client -t"
# prefix+T: fuzzy-pick a project dir from ~/.tmux-session-paths (one per line, ~ and # comments ok) and open it with tp
bind T display-popup -E -w 60% -h 50% 'sed -e "s|^~|$HOME|" -e "/^#/d" ~/.tmux-session-paths | grep . | fzf --reverse | { read -r d && tp "$d"; }'
# Killing the current project session switches to another one instead of detaching
set -g detach-on-destroy off
# prefix+X: save, then close the current project session; prefix+S can resume it later
bind X confirm-before -p "kill session #S? (y/n)" \
  "run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet' ; kill-session"
# prefix+S: fuzzy-pick saved sessions that are not open and resume them (see bin/tmux-sessions)
bind S display-popup -E -w 60% -h 50% '~/.dotfiles/bin/tmux-sessions pick'

# Room for long project names in the default "[session] " status-left
set -g status-left-length 30

# Move current window left/right in the window list (repeatable)
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# set-option -g prefix C-a
set -g set-clipboard on


# unbind C-b
# set -g prefix `
# bind-key ` send-prefix

# set -g @plugin 'tmux-plugins/tmux-yank'

# Save the whole workspace: every session, window, split, cwd and nvim (prefix+C-s);
# continuum autosaves every 15 min and every detach saves too. Each save is also split
# into one file per session (bin/tmux-sessions), so nothing is restored on tmux start:
# prefix+S resumes the sessions you pick, prefix+C-r still restores the last full save.
# The hooks resume each claude pane with its own session.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-hook-post-save-layout '~/.dotfiles/bin/tmux-sessions save'
# last_resurrect_file is resurrect's own helper, expanded by its eval of the hook
set -g @resurrect-hook-post-restore-all '~/.dotfiles/bin/tmux-claude-resurrect restore "$(last_resurrect_file)"'
set-hook -g client-detached "run-shell -b '~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet'"

# keep at the very bottom
run '~/.tmux/plugins/tpm/tpm'


